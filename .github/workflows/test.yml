name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MONO_VERSION: 6.12.0.205

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.variables.outputs.version }}
    steps:
      - name: Cache source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: source-cache
        with:
          key: mono-source-${{ env.MONO_VERSION }}
          path: mono-${{ env.MONO_VERSION }}.tar.xz

      - name: Grab source tarball
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://download.mono-project.com/sources/mono/preview/mono-${MONO_VERSION}.tar.xz

  build_linux:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm
          - arm64
          - x64
          - x86
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore source
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mono-source-${{ env.MONO_VERSION }}
          path: mono-${{ env.MONO_VERSION }}.tar.xz
          fail-on-cache-miss: true

      - name: Unzip source tarball
        run: |
          mkdir mono-src
          tar xf ./mono-${MONO_VERSION}.tar.xz -C mono-src --strip-components=1

      - name: Build
        uses: docker://mirror.gcr.io/debian:trixie
        with:
          args: /bin/sh -euc "apt update; apt install -y --no-install-recommends build-essential autoconf automake libtool cmake make python3-minimal gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-i686-linux-gnu g++-i686-linux-gnu; ./build.sh linux-${{ matrix.architecture }}"

      - name: List artifacts
        run: |
          file mono-src/support/.libs/libMonoPosixHelper.*
          ldd mono-src/support/.libs/libMonoPosixHelper.so || true

      - name: Prepare build artifact
        run: mkdir -p build/linux-${{ matrix.architecture }} && cp mono-src/support/.libs/libMonoPosixHelper.so build/linux-${{ matrix.architecture }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux-${{ matrix.architecture }}
          path: build
          if-no-files-found: error

  build_linux_musl:
    runs-on: ${{ startsWith(matrix.architecture, 'arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore source
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mono-source-${{ env.MONO_VERSION }}
          path: mono-${{ env.MONO_VERSION }}.tar.xz
          fail-on-cache-miss: true

      - name: Unzip source tarball
        run: |
          mkdir mono-src
          tar xf ./mono-${MONO_VERSION}.tar.xz -C mono-src --strip-components=1

      - name: Build
        uses: docker://mirror.gcr.io/alpine:3.24
        with:
          args: /bin/sh -euc "apk add -U --no-cache bash alpine-sdk autoconf automake libtool cmake make python3; ./build.sh linux-musl-${{ matrix.architecture }}"

      - name: List artifacts
        run: |
          file mono-src/support/.libs/libMonoPosixHelper.*
          ldd mono-src/support/.libs/libMonoPosixHelper.so || true

      - name: Prepare build artifact
        run: mkdir -p build/linux-musl-${{ matrix.architecture }} && cp mono-src/support/.libs/libMonoPosixHelper.so build/linux-musl-${{ matrix.architecture }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux-musl-${{ matrix.architecture }}
          path: build
          if-no-files-found: error

  build_freebsd:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        architecture:
#          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore source
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mono-source-${{ env.MONO_VERSION }}
          path: mono-${{ env.MONO_VERSION }}.tar.xz
          fail-on-cache-miss: true

      - name: Unzip source tarball
        run: |
          mkdir mono-src
          tar xf ./mono-${MONO_VERSION}.tar.xz -C mono-src --strip-components=1

      - name: Build
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          release: 13.5
          usesh: true
          arch: ${{ matrix.architecture == 'arm64' && 'aarch64' || 'x86_64' }}
          prepare: |
            pkg install -y bash autoconf automake libtool cmake gmake python3
          run: |
            ./build.sh freebsd-${{ matrix.architecture }}

      - name: List artifacts
        run: |
          file mono-src/support/.libs/libMonoPosixHelper.*
          ldd mono-src/support/.libs/libMonoPosixHelper.so || true

      - name: Prepare build artifact
        run: mkdir -p build/freebsd-${{ matrix.architecture }} && cp mono-src/support/.libs/libMonoPosixHelper.so build/freebsd-${{ matrix.architecture }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-freebsd-${{ matrix.architecture }}
          path: build
          if-no-files-found: error

  build_mac:
    runs-on: macos-14
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore source
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mono-source-${{ env.MONO_VERSION }}
          path: mono-${{ env.MONO_VERSION }}.tar.xz
          fail-on-cache-miss: true

      - name: Unzip source tarball
        run: |
          mkdir mono-src
          tar xf ./mono-${MONO_VERSION}.tar.xz -C mono-src --strip-components=1

      - name: Install dependecies
        run: |
          brew install autoconf automake libtool cmake make python3

      - name: Build
        run: |
          ./build.sh osx-${{ matrix.architecture }}

      - name: List artifacts
        run: |
          otool -L mono-src/support/.libs/libMonoPosixHelper.dylib
          otool -l mono-src/support/.libs/libMonoPosixHelper.dylib
          file mono-src/support/.libs/libMonoPosixHelper.*

      - name: Prepare build artifact
        run: mkdir -p build/osx-${{ matrix.architecture }} && cp mono-src/support/.libs/libMonoPosixHelper.dylib build/osx-${{ matrix.architecture }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-osx-${{ matrix.architecture }}
          path: build
          if-no-files-found: error
